              cd "$SRC"
              if [ -f project.yml ]; then
                command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
                xcodegen generate --spec project.yml
              fi
              prj=""
              scheme=""
              if [ -n "${APP_SCHEME:-}" ]; then
                case "$APP_SCHEME" in
                  *[!A-Za-z0-9._+-]*) compile_fail "invalid scheme" ;;
                esac
                scheme=$APP_SCHEME
              fi
              for cand in *.xcodeproj; do
                [ -d "$cand" ] || continue
                if [ -n "$scheme" ] && [ "$cand" = "${scheme}.xcodeproj" ]; then
                  prj=$cand
                  break
                fi
                if [ -z "$prj" ]; then
                  prj=$cand
                fi
              done
              [ -n "$prj" ] && [ -d "$prj" ] || compile_fail "xcodeproj missing"
              if [ -z "$scheme" ]; then
                scheme=$(basename "$prj" .xcodeproj)
              fi
              pbx="$prj/project.pbxproj"
              [ -f "$pbx" ] || compile_fail "project file missing"
              dest=$(compile_only_destination "$pbx" "$mode")
              sdk=$(compile_only_sdk "$dest") || compile_fail "invalid compile destination"
              printf 'compile project=%s scheme=%s destination=%s sdk=%s\n' "$prj" "$scheme" "$dest" "$sdk"
              set +e
              xcodebuild -project "$prj" -scheme "$scheme" -configuration Release \
                -destination "$dest" -sdk "$sdk" \
                build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                >"$out" 2>&1
              st=$?
              set -e
            elif [ "$BUILD_KIND" = "workspace" ]; then
              [ -n "${SCHEME:-}" ] || compile_fail "scheme missing"
              cd "$SRC/ios"
              if [ "$mode" = "simulator" ]; then
                dest="generic/platform=iOS Simulator"
              else
                dest="generic/platform=iOS"
              fi
              sdk=$(compile_only_sdk "$dest") || compile_fail "invalid compile destination"
              printf 'compile workspace=%s scheme=%s destination=%s sdk=%s\n' "$SCHEME.xcworkspace" "$SCHEME" "$dest" "$sdk"
              set +e
              xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
                -destination "$dest" -sdk "$sdk" \
                build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                >"$out" 2>&1
              st=$?
              set -e
            else
              compile_fail "invalid build kind"
            fi

            cat "$out"
            if [ "$st" -ne 0 ]; then
              printf 'xcodebuild exit %s\n' "$st" >&3
              compile_only_public_errors "$out" >&3 || true
              exit "$st"
            fi
            printf '✔ ok\n' >&3
          }

          if [ "${COMPILE_ONLY_LIB:-}" != 1 ]; then
            compile_only_main
          fi
          COMPILE_ONLY_EOF

      - name: Export IPA
        if: ${{ !inputs.compile_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          O="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$O" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingCertificate</key><string>${SIGN_SHA1}</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>${WATCH_BUNDLE_ID:+<key>${WATCH_BUNDLE_ID}</key><string>${WATCH_PROFILE_UUID}</string>}${EXT_BUNDLE_ID:+<key>${EXT_BUNDLE_ID}</key><string>${EXT_PROFILE_UUID}</string>}</dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$O"
          ls -la "$RUNNER_TEMP/export"
          echo "✔ ok ($(du -h "$RUNNER_TEMP"/export/*.ipa | cut -f1 | tr -d ' '))" >&3

      - name: Upload to TestFlight
        if: ${{ inputs.upload && !inputs.compile_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          umask 077; D="$HOME/.appstoreconnect/private_keys"; mkdir -p "$D"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$D/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "✔ ok" >&3

      - name: Cleanup
        if: always()
        run: |
          exec 3>&1 >>"${LOG:-/dev/null}" 2>&1
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -rf "$HOME/.appstoreconnect" "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$RUNNER_TEMP/dk" "$RUNNER_TEMP/p.mobileprovision" "$RUNNER_TEMP/p.plist" "${APP_ENV_FILE:-}"
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/origin-auth" "$RUNNER_TEMP/xcodebuild.out"
          fi
          echo "✔ ok" >&3

      - name: Encrypt log
        if: always()
        env:
          LOG_PUBKEY: ${{ secrets.LOG_PUBKEY }}
        run: |
          exec 3>&1 >/dev/null 2>&1
          O="$RUNNER_TEMP/enclog"; mkdir -p "$O"; [ -f "$LOG" ] || : > "$LOG"
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"; [ -x "$OSSL" ] || OSSL=openssl
          K=$(openssl rand -hex 32); echo "::add-mask::$K" >&3
          printf '%s\n' "$LOG_PUBKEY" > "$O/pub.pem"
          printf '%s' "$K" | "$OSSL" pkeyutl -encrypt -pubin -inkey "$O/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$O/key.bin"
          gzip -c "$LOG" | "$OSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "pass:$K" -out "$O/log.gz.enc"
          rm -f "$O/pub.pem" "$LOG"
          echo "✔ ok" >&3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_id }}
          path: ${{ runner.temp }}/enclog/
          retention-days: 1
          if-no-files-found: ignore

