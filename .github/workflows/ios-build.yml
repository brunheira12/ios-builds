                  fi
                  ;;
              esac
            done < "$file"
          }

          compile_only_main() {
            if ! { true >&3; } 2>/dev/null; then
              exec 3>&1
            fi
            : "${SRC:?}"
            : "${RUNNER_TEMP:?}"
            : "${BUILD_KIND:?}"
            mode=${COMPILE_DESTINATION:-ios}
            case "$mode" in
              ios|simulator) ;;
              *) compile_fail "invalid compile destination" ;;
            esac
