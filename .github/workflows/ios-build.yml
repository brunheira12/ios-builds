              esac
              line=$(compile_only_relativize "$line")
              case "$line" in
                *": error:"*|*"fatal error:"*|*"Undefined symbols"*|*"undefined symbol"*|*"ld: "*|*"clang: "*|*"** BUILD FAILED"*|*"** BUILD SUCCEEDED"*|*"The following build commands failed"*)
