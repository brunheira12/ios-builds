# Builds an iOS app from a private repo and uploads it to TestFlight.
# APP1–APP9 keep the GitHub deploy-key checkout. They sign, export, and upload
# whenever this workflow is dispatched with compile_only left at its default (false).
# APP10 is an opt-in slot: APPn_SOURCE=origin checks out a pinned Origin commit.
# compile_only=true skips certificates, profiles, export, and TestFlight and runs
# xcodebuild build with CODE_SIGNING_ALLOWED=NO. It does not change APP1–APP9 unless
# that input is set. Tool output goes to an encrypted log. The public log shows step
# status and, on a compile-only failure, the xcodebuild exit code plus sanitized
# compiler errors (no source lines, no tokens).
name: ios-build
run-name: iOS build
on:
  workflow_dispatch:
    inputs:
      app:
        description: App slot
        type: choice
        options: [APP1, APP2, APP3, APP4, APP5, APP6, APP7, APP8, APP9, APP10]
        default: APP1
      build_number:
        description: Build number (CFBundleVersion)
        required: true
        type: string
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true
      xcode:
        description: Xcode version (empty = runner default)
        type: string
        default: ''
      compile_only:
        description: Compile only; skip signing, export, and TestFlight
        type: boolean
        default: false
      compile_destination:
        description: Compile-only destination (ignored unless compile only)
        type: choice
        options: [ios, simulator]
        default: ios

permissions: {}

concurrency:
  group: ios-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Prepare
        env:
          APP_REPO: ${{ secrets[format('{0}_REPO', inputs.app)] }}
          APP_SUBDIR: ${{ secrets[format('{0}_SUBDIR', inputs.app)] }}
          APP_ENV: ${{ secrets[format('{0}_ENV', inputs.app)] }}
          APP_SOURCE: ${{ secrets[format('{0}_SOURCE', inputs.app)] }}
          APP_REF: ${{ secrets[format('{0}_REF', inputs.app)] }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "invalid build number"; exit 1; }
          [ -n "$APP_REPO" ] || { echo "slot not configured"; exit 1; }
          for v in "$APP_REPO" "${APP_REPO#*/}" "${APP_REPO%%/*}"; do echo "::add-mask::$v"; done
          echo "LOG=$RUNNER_TEMP/build.log" >> "$GITHUB_ENV"
          echo "SRC=$RUNNER_TEMP/src/$APP_SUBDIR" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/build.log"
          # optional per-app build-time env (KEY=VALUE lines); values are masked and kept in a 0600 file
          E="$RUNNER_TEMP/app.env"; (umask 077; : > "$E")
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"; [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || continue
            v="${line#*=}"; [ -n "$v" ] && echo "::add-mask::$v"
            printf 'export %s=%q\n' "${line%%=*}" "$v" >> "$E"
          done <<< "$APP_ENV"
          echo "APP_ENV_FILE=$E" >> "$GITHUB_ENV"
          # Empty APPn_SOURCE stays on the GitHub deploy-key checkout (APP1–APP9).
          case "${APP_SOURCE:-github}" in
            github)
              echo "SOURCE_KIND=github" >> "$GITHUB_ENV"
              ;;
            origin)
              [[ "${APP_REF:-}" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "slot ref not configured"; exit 1; }
              echo "SOURCE_KIND=origin" >> "$GITHUB_ENV"
              ;;
            *)
              echo "invalid source"; exit 1
              ;;
          esac
          echo "✔ ok"

      - name: Checkout source
        if: ${{ env.SOURCE_KIND != 'origin' }}
        env:
          APP_REPO: ${{ secrets[format('{0}_REPO', inputs.app)] }}
          DEPLOY_KEY: ${{ secrets[format('{0}_DEPLOY_KEY', inputs.app)] }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          K="$RUNNER_TEMP/dk"; umask 077; printf '%s\n' "$DEPLOY_KEY" > "$K"
          GIT_SSH_COMMAND="ssh -i $K -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 "git@github.com:${APP_REPO}.git" "$RUNNER_TEMP/src"
          rm -f "$K"
          git -C "$RUNNER_TEMP/src" log -1 --format='commit %H %s'
          # native Xcode project (xcodegen project.yml or committed .xcodeproj, no package.json) skips Expo/npm
          if [ ! -f "$SRC/package.json" ] && { [ -f "$SRC/project.yml" ] || compgen -G "$SRC/*.xcodeproj" >/dev/null; }; then
            echo "NATIVE=1" >> "$GITHUB_ENV"; echo "✔ ok (native)" >&3
          else
            echo "NATIVE=0" >> "$GITHUB_ENV"; echo "✔ ok" >&3
          fi

      - name: Checkout Origin source
        if: ${{ env.SOURCE_KIND == 'origin' }}
        env:
          APP_REPO: ${{ secrets[format('{0}_REPO', inputs.app)] }}
          APP_REF: ${{ secrets[format('{0}_REF', inputs.app)] }}
          APP_BRANCH: ${{ secrets[format('{0}_BRANCH', inputs.app)] }}
          APP_SUBDIR: ${{ secrets[format('{0}_SUBDIR', inputs.app)] }}
          APP_VERIFY_PATH: ${{ secrets[format('{0}_VERIFY_PATH', inputs.app)] }}
          APP_REQUIRE_SUBMODULE: ${{ secrets[format('{0}_REQUIRE_SUBMODULE', inputs.app)] }}
          ORIGIN_APP_ID: ${{ secrets.ORIGIN_APP_ID }}
          ORIGIN_INSTALLATION_ID: ${{ secrets.ORIGIN_INSTALLATION_ID }}
          ORIGIN_APP_PRIVATE_KEY: ${{ secrets.ORIGIN_APP_PRIVATE_KEY }}
          ORIGIN_REPOSITORY_ID: ${{ secrets.ORIGIN_REPOSITORY_ID }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          bash -s <<'ORIGIN_CHECKOUT_EOF'
          #!/usr/bin/env bash
          # Check out one pinned Origin commit for ios-build.
          #
          # Origin stays the source of truth. This script mints a short-lived installation
          # access token (repository:contents:read only) from an Origin App JWT, then
          # clones with Git HTTPS. The token is never placed in a remote URL, argv, the
          # git config, or the public log (fd 3).
          #
          # A repo tarball (GET /v1/origin/repos/{owner}/{repo}/tarball/{ref}) is not used:
          # the archive has no gitlinks, so a Snes9x submodule pin cannot be fetched or
          # checked. Git HTTPS is the documented contents:read path and keeps submodule
          # SHAs. CloneKit is an Enterprise option and is not used here.
          #
          # Bash 3.2 compatible (macOS /bin/bash).
          set -euo pipefail

          origin_fail() {
            printf '%s\n' "$1" >&3
            exit 1
          }

          origin_openssl() {
            if [ -n "${OPENSSL_BIN:-}" ] && [ -x "${OPENSSL_BIN}" ]; then
              printf '%s\n' "$OPENSSL_BIN"
              return
            fi
            if command -v brew >/dev/null 2>&1; then
              prefix=$(brew --prefix openssl@3 2>/dev/null || true)
              if [ -n "$prefix" ] && [ -x "$prefix/bin/openssl" ]; then
                printf '%s\n' "$prefix/bin/openssl"
                return
              fi
            fi
            command -v openssl
          }

          origin_b64url() {
            "$OSSL" base64 -A | tr '+/' '-_' | tr -d '='
          }

          origin_validate_repo() {
            case "$1" in
              *.git|*/*/*|*/|/*|*..*|.|.*) return 1 ;;
            esac
            case "$1" in
              [A-Za-z0-9._-]*/[A-Za-z0-9._-]*) ;;
              *) return 1 ;;
            esac
            case "$1" in
              *[!A-Za-z0-9._/-]*) return 1 ;;
            esac
            return 0
          }

          origin_validate_ref() {
            case "$1" in
              *[!0-9A-Fa-f]*) return 1 ;;
            esac
            n=${#1}
            [ "$n" -ge 7 ] && [ "$n" -le 40 ]
          }

          origin_validate_branch() {
            [ -n "$1" ] || return 1
            case "$1" in
              -*|/*|*/|refs/*|*..*|.|..) return 1 ;;
            esac
            case "$1" in
              *[!A-Za-z0-9._/-]*) return 1 ;;
            esac
            return 0
          }

          origin_validate_relpath() {
            [ -n "$1" ] || return 1
            case "$1" in
              /*|*\\*|..|../*|*/..|*/../*|*..*) return 1 ;;
            esac
            return 0
          }

          origin_token_body() {
            if [ -n "${1:-}" ]; then
              printf '{"scopes":["repository:contents:read"],"repositoryIds":["%s"]}\n' "$1"
            else
              printf '%s\n' '{"scopes":["repository:contents:read"]}'
            fi
          }

          origin_rewrite_submodule_url() {
            url=$1
            case "$url" in
              git@github.com:*)
                printf 'https://github.com/%s\n' "${url#git@github.com:}"
                ;;
              ssh://git@github.com/*)
                printf 'https://github.com/%s\n' "${url#ssh://git@github.com/}"
                ;;
              git@origin.cursor.com:*)
                printf 'https://origin.cursor.com/%s\n' "${url#git@origin.cursor.com:}"
                ;;
              ssh://git@origin.cursor.com/*)
                printf 'https://origin.cursor.com/%s\n' "${url#ssh://git@origin.cursor.com/}"
                ;;
              *)
                printf '%s\n' "$url"
                ;;
            esac
          }

          # Read SHAs on stdin. Print the single SHA whose lowercase form starts with the
          # lowercase ref. Exit 2 when none match, 3 when more than one matches.
          origin_select_commit() {
            ref_low=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            hits=$2
            : > "$hits"
            while IFS= read -r sha || [ -n "$sha" ]; do
              [ -n "$sha" ] || continue
              sha_low=$(printf '%s' "$sha" | tr '[:upper:]' '[:lower:]')
              case "$sha_low" in
                "$ref_low"*) printf '%s\n' "$sha" >> "$hits" ;;
              esac
            done
            count=$(wc -l < "$hits" | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              return 2
            fi
            if [ "$count" -ne 1 ]; then
              return 3
            fi
            cat "$hits"
          }

          origin_lower() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]'
          }

          origin_checkout_main() {
            if ! { true >&3; } 2>/dev/null; then
              exec 3>&1
            fi

            : "${RUNNER_TEMP:?}"
            : "${GITHUB_ENV:?}"
            case "$RUNNER_TEMP" in
              ""|"/") origin_fail "runner temp missing" ;;
            esac

            command -v git >/dev/null 2>&1 || origin_fail "git not available"
            command -v curl >/dev/null 2>&1 || origin_fail "curl not available"
            command -v jq >/dev/null 2>&1 || origin_fail "jq not available"
            OSSL=$(origin_openssl) || origin_fail "openssl ed25519 signer not available"
            [ -n "$OSSL" ] && [ -x "$OSSL" ] || origin_fail "openssl ed25519 signer not available"

            [ -n "${ORIGIN_APP_ID:-}" ] && [ -n "${ORIGIN_INSTALLATION_ID:-}" ] && [ -n "${ORIGIN_APP_PRIVATE_KEY:-}" ] || origin_fail "origin auth not configured"
            case "$ORIGIN_APP_PRIVATE_KEY" in
              *"BEGIN PRIVATE KEY"*) ;;
              *) origin_fail "origin key not configured" ;;
            esac
            case "$ORIGIN_APP_ID" in
              app_[A-Za-z0-9]*) ;;
              *) origin_fail "origin app id not configured" ;;
            esac
            case "$ORIGIN_APP_ID" in
              *[!A-Za-z0-9_]*) origin_fail "origin app id not configured" ;;
            esac
            case "${ORIGIN_INSTALLATION_ID}" in
              *[!A-Za-z0-9_-]*) origin_fail "origin installation not configured" ;;
            esac
            if [ "${#ORIGIN_INSTALLATION_ID}" -lt 2 ]; then
              origin_fail "origin installation not configured"
            fi
            origin_validate_repo "${APP_REPO:-}" || origin_fail "invalid repo"
            origin_validate_ref "${APP_REF:-}" || origin_fail "slot ref not configured"
            APP_REF=$(origin_lower "$APP_REF")
            branch=${APP_BRANCH:-main}
            origin_validate_branch "$branch" || origin_fail "invalid branch"
            case "${APP_SUBDIR:-}" in
              "") ;;
              *) origin_validate_relpath "$APP_SUBDIR" || origin_fail "invalid subdir" ;;
            esac
            [ -n "${APP_VERIFY_PATH:-}" ] || origin_fail "verify path not configured"
            case "${APP_REQUIRE_SUBMODULE:-}" in
              "") ;;
              *[!A-Za-z0-9._/-]*) origin_fail "invalid submodule" ;;
            esac
            repo_id=${ORIGIN_REPOSITORY_ID:-}
            if [ -n "$repo_id" ]; then
              case "$repo_id" in
                repo_[A-Za-z0-9]*) ;;
                *) origin_fail "invalid repository id" ;;
              esac
              case "$repo_id" in
                *[!A-Za-z0-9_]*) origin_fail "invalid repository id" ;;
              esac
            fi

            # Never reuse a developer session token that may already be in the environment.
            unset CURSOR_AUTH_TOKEN || true

            umask 077
            AUTH="$RUNNER_TEMP/origin-auth"
            rm -rf "$AUTH"
            mkdir -p "$AUTH"
            chmod 700 "$AUTH"
            cleanup_auth() {
              if [ -n "${AUTH:-}" ] && [ -d "$AUTH" ]; then
                rm -rf "$AUTH"
              fi
            }
            trap cleanup_auth EXIT

            KEY="$AUTH/app.pem"
            printf '%s\n' "$ORIGIN_APP_PRIVATE_KEY" > "$KEY"
            chmod 600 "$KEY"

            now=$(date +%s)
            header=$(printf '{"alg":"EdDSA","kid":"%s","typ":"JWT"}' "$ORIGIN_APP_ID" | origin_b64url)
            claims=$(printf '{"iss":"%s","aud":"origin-apps","iat":%d,"exp":%d}' "$ORIGIN_APP_ID" "$now" "$((now + 900))" | origin_b64url)
            signing_input="$AUTH/jwt.in"
            printf '%s.%s' "$header" "$claims" > "$signing_input"
            sig_raw="$AUTH/jwt.sig"
            if ! "$OSSL" pkeyutl -sign -rawin -in "$signing_input" -inkey "$KEY" > "$sig_raw"; then
              origin_fail "openssl ed25519 signer not available"
            fi
            signature=$(origin_b64url < "$sig_raw")
            app_jwt="$header.$claims.$signature"
            printf '::add-mask::%s\n' "$app_jwt" >&3
            rm -f "$KEY" "$signing_input" "$sig_raw"
            unset ORIGIN_APP_PRIVATE_KEY || true

            body=$(origin_token_body "$repo_id")
            resp_file="$AUTH/token.json"
            token_url="https://api.cursor.com/v1/origin/app/installations/${ORIGIN_INSTALLATION_ID}/access_tokens"
            set +e
            http=$(printf 'Authorization: Bearer %s\n' "$app_jwt" \
              | curl --proto '=https' --tlsv1.2 --max-time 60 -sS -o "$resp_file" -w '%{http_code}' \
                  -X POST -H @- -H 'Content-Type: application/json' --data "$body" "$token_url")
            curl_st=$?
            set -e
            if [ "$curl_st" -ne 0 ]; then
              origin_fail "origin token request failed"
            fi
            if [ "$http" != "200" ]; then
              printf 'token http %s\n' "$http"
              if [ -f "$resp_file" ]; then
                sed -E 's/oit_[A-Za-z0-9._-]+/[redacted]/g' "$resp_file" || true
              fi
              origin_fail "origin token request rejected"
            fi
            token=$(jq -er '.token' "$resp_file")
            case "$token" in
              oit_[A-Za-z0-9]*) ;;
              *) origin_fail "origin token missing" ;;
            esac
            case "$token" in
              *[!A-Za-z0-9_-]*) origin_fail "origin token missing" ;;
            esac
            printf '::add-mask::%s\n' "$token" >&3
            TOK="$AUTH/token"
            printf '%s' "$token" > "$TOK"
            chmod 600 "$TOK"
            rm -f "$resp_file"
            unset token app_jwt signature || true
            export ORIGIN_TOKEN_FILE="$TOK"

            CRED_HELPER="$AUTH/cred.sh"
            cat > "$CRED_HELPER" <<'EOF'
          #!/bin/bash
          set -eu
          op="${1:-get}"
          [ "$op" = "get" ] || exit 0
          proto=""
          host=""
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && break
            case "$line" in
              protocol=*) proto="${line#protocol=}" ;;
              host=*) host="${line#host=}" ;;
            esac
          done
          [ "$proto" = "https" ] || exit 0
          [ "$host" = "origin.cursor.com" ] || exit 0
          [ -n "${ORIGIN_TOKEN_FILE:-}" ] && [ -f "$ORIGIN_TOKEN_FILE" ] || exit 0
          printf 'username=x-access-token\npassword=%s\n' "$(cat "$ORIGIN_TOKEN_FILE")"
          EOF
            chmod 700 "$CRED_HELPER"

            ASKPASS="$AUTH/askpass.sh"
            printf '#!/bin/bash\nexit 1\n' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS="$ASKPASS"
            export GIT_CONFIG_GLOBAL="$AUTH/empty-gitconfig"
            : > "$GIT_CONFIG_GLOBAL"
            export GIT_CONFIG_NOSYSTEM=1

            origin_git() {
              git \
                -c "safe.directory=*" \
                -c advice.detachedHead=false \
                -c credential.helper= \
                -c "credential.helper=${CRED_HELPER}" \
                -c credential.useHttpPath=true \
                "$@"
            }

            repo="$RUNNER_TEMP/src"
            rm -rf "$repo"
            mkdir -p "$repo"
            origin_git init -q "$repo"
            origin_git -C "$repo" remote add origin "https://origin.cursor.com/${APP_REPO}.git"

            ref_low=$(origin_lower "$APP_REF")
            fetched=0
            if [ "${#APP_REF}" -eq 40 ]; then
              set +e
              origin_git -C "$repo" fetch --no-tags --depth 1 origin "$APP_REF"
              fetch_st=$?
              set -e
              if [ "$fetch_st" -eq 0 ]; then
                origin_git -C "$repo" checkout -q --detach FETCH_HEAD
                fetched=1
              else
                printf 'direct sha fetch failed; trying branch\n'
              fi
            fi
            if [ "$fetched" -ne 1 ]; then
              if ! origin_git -C "$repo" fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
                origin_fail "origin fetch failed"
              fi
              set +e
              chosen=$(origin_git -C "$repo" rev-list "refs/remotes/origin/${branch}" | origin_select_commit "$APP_REF" "$AUTH/matches")
              sel=$?
              set -e
              if [ "$sel" -ne 0 ]; then
                if [ "$sel" -eq 3 ]; then
                  origin_fail "ref not unique on branch"
                fi
                origin_fail "ref not on branch"
              fi
              origin_git -C "$repo" checkout -q --detach "$chosen"
            fi

            got=$(origin_git -C "$repo" rev-parse HEAD)
            got_low=$(origin_lower "$got")
            case "$got_low" in
              "$ref_low"*) ;;
              *)
                printf 'head %s\n' "$got"
                origin_fail "commit mismatch"
                ;;
            esac
            if [ "${#APP_REF}" -eq 40 ] && [ "$got_low" != "$ref_low" ]; then
              printf 'head %s\n' "$got"
              origin_fail "commit mismatch"
            fi
            printf 'commit %s\n' "$got"
            origin_git -C "$repo" log -1 --format='commit %H %s'

            if [ -f "$repo/.gitmodules" ]; then
              git -C "$repo" config -f .gitmodules --get-regexp '^submodule\..*\.url$' > "$AUTH/sub-urls" || true
              while IFS= read -r line || [ -n "$line" ]; do
                [ -n "$line" ] || continue
                key=${line%% *}
                url=${line#* }
                new=$(origin_rewrite_submodule_url "$url")
                if [ "$new" != "$url" ]; then
                  git -C "$repo" config -f .gitmodules "$key" "$new"
                  printf 'rewrote submodule remote %s\n' "$key"
                fi
              done < "$AUTH/sub-urls"
              origin_git -C "$repo" submodule sync --recursive
              origin_git -C "$repo" submodule update --init --recursive
            fi

            sub_n=0
            needle=${APP_REQUIRE_SUBMODULE:-}
            needle_low=$(origin_lower "$needle")
            found_required=0
            : > "$AUTH/tree"
            # NUL-delimited records; the trailing empty read is ignored.
            git -C "$repo" ls-tree -r -z HEAD > "$AUTH/tree" || origin_fail "tree read failed"
            while IFS= read -r -d '' rec || [ -n "$rec" ]; do
              [ -n "$rec" ] || continue
              mode=${rec%% *}
              rest=${rec#* }
              rest=${rest#* }
              sha=${rest%%$'\t'*}
              path=${rest#*$'\t'}
              [ "$mode" = "160000" ] || continue
              sub_n=$((sub_n + 1))
              if [ ! -d "$repo/$path/.git" ] && [ ! -f "$repo/$path/.git" ]; then
                printf 'submodule not checked out %s\n' "$path"
                origin_fail "submodule missing"
              fi
              got_sub=$(git -C "$repo/$path" rev-parse HEAD)
              if [ "$(origin_lower "$got_sub")" != "$(origin_lower "$sha")" ]; then
                printf 'pin %s got %s path %s\n' "$sha" "$got_sub" "$path"
                origin_fail "submodule pin mismatch"
              fi
              printf 'submodule %s %s\n' "$sha" "$path"
              path_low=$(origin_lower "$path")
              url_low=""
              if [ -f "$repo/.gitmodules" ]; then
                url_line=$(awk -v p="$path" '
                  /^\[submodule / { sp=""; su="" }
                  /^[ \t]*path[ \t]*=/ { sub(/^[^=]*=[ \t]*/, ""); sp=$0 }
                  /^[ \t]*url[ \t]*=/ { sub(/^[^=]*=[ \t]*/, ""); su=$0 }
                  sp == p && su != "" { print su; exit }
                ' "$repo/.gitmodules" || true)
                url_low=$(origin_lower "$url_line")
              fi
              if [ -n "$needle_low" ]; then
                case "$path_low" in
                  *"$needle_low"*) found_required=1 ;;
                esac
                case "$url_low" in
                  *"$needle_low"*) found_required=1 ;;
                esac
              fi
              case "$path_low$url_low" in
                *snes9x*) printf 'snes9x %s\n' "$sha" ;;
              esac
            done < "$AUTH/tree"
            printf 'submodules %s\n' "$sub_n"
            if [ -n "$needle_low" ] && [ "$found_required" -ne 1 ]; then
              origin_fail "required submodule missing"
            fi

            printf '%s' "$APP_VERIFY_PATH" | tr ',;' '\n\n' > "$AUTH/paths"
            verified=0
            while IFS= read -r p || [ -n "$p" ]; do
              p=$(printf '%s' "$p" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              [ -n "$p" ] || continue
              origin_validate_relpath "$p" || origin_fail "invalid verify path"
              if [ ! -e "$repo/$p" ]; then
                printf 'missing verify entry\n'
                origin_fail "verify path missing"
              fi
              printf 'verified %s\n' "$p"
              verified=$((verified + 1))
            done < "$AUTH/paths"
            [ "$verified" -ge 1 ] || origin_fail "verify path not configured"

            if [ -n "${APP_SUBDIR:-}" ] && [ ! -d "$repo/$APP_SUBDIR" ]; then
              origin_fail "subdir missing"
            fi

            # Match the GitHub checkout: native projects skip Expo. SRC is set in Prepare.
            if [ ! -f "$SRC/package.json" ] && { [ -f "$SRC/project.yml" ] || compgen -G "$SRC/*.xcodeproj" >/dev/null; }; then
              echo "NATIVE=1" >> "$GITHUB_ENV"
              echo "✔ ok (native)" >&3
            else
              echo "NATIVE=0" >> "$GITHUB_ENV"
              echo "✔ ok" >&3
            fi
          }

          if [ "${ORIGIN_CHECKOUT_LIB:-}" != 1 ]; then
            origin_checkout_main
          fi
          ORIGIN_CHECKOUT_EOF

      - name: Select Xcode
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"; fi
          xcodebuild -version
          echo "✔ $(xcodebuild -version | head -1)" >&3

      - uses: actions/setup-node@v4
        if: ${{ env.NATIVE != '1' }}
        with:
          node-version: 22

      - name: Install JS dependencies
        if: ${{ env.NATIVE != '1' }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC"; node -v; npm -v
          npm ci --no-audit --no-fund
          echo "✔ ok" >&3

      - name: Signing setup
        if: ${{ !inputs.compile_only }}
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets[format('{0}_PROFILE_B64', inputs.app)] }}
          WATCH_PROFILE_B64: ${{ secrets[format('{0}_WATCH_PROFILE_B64', inputs.app)] }}
          EXT_PROFILE_B64: ${{ secrets[format('{0}_EXT_PROFILE_B64', inputs.app)] }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          umask 077; T="$RUNNER_TEMP"
          KCP=$(openssl rand -hex 24); echo "::add-mask::$KCP" >&3
          KC="$T/sign.keychain-db"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          printf '%s' "$P12_B64" | base64 --decode > "$T/d.p12"
          security import "$T/d.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$T/d.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA1=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')
          [ -n "$SHA1" ]; echo "::add-mask::$SHA1" >&3
          printf '%s' "$PROFILE_B64" | base64 --decode > "$T/p.mobileprovision"
          security cms -D -i "$T/p.mobileprovision" > "$T/p.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$T/p.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$T/p.plist")
          BUNDLE_ID="${APPID#*.}"
          for v in "$UUID" "$BUNDLE_ID"; do echo "::add-mask::$v" >&3; done
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$T/p.mobileprovision" "$d/$UUID.mobileprovision"; done
          { echo "KC=$KC"; echo "SIGN_SHA1=$SHA1"; echo "PROFILE_UUID=$UUID"; echo "BUNDLE_ID=$BUNDLE_ID"; } >> "$GITHUB_ENV"
          if [ -n "$WATCH_PROFILE_B64" ]; then
            printf '%s' "$WATCH_PROFILE_B64" | base64 --decode > "$T/w.mobileprovision"
            security cms -D -i "$T/w.mobileprovision" > "$T/w.plist"
            WUUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$T/w.plist")
            WAPPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$T/w.plist")
            WBUNDLE_ID="${WAPPID#*.}"
            for v in "$WUUID" "$WBUNDLE_ID"; do echo "::add-mask::$v" >&3; done
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              cp "$T/w.mobileprovision" "$d/$WUUID.mobileprovision"; done
            rm -f "$T/w.mobileprovision" "$T/w.plist"
            { echo "WATCH_PROFILE_UUID=$WUUID"; echo "WATCH_BUNDLE_ID=$WBUNDLE_ID"; } >> "$GITHUB_ENV"
          fi
          # optional 3rd profile for an app extension (e.g. a watchOS WidgetKit complication)
          if [ -n "$EXT_PROFILE_B64" ]; then
            printf '%s' "$EXT_PROFILE_B64" | base64 --decode > "$T/x.mobileprovision"
            security cms -D -i "$T/x.mobileprovision" > "$T/x.plist"
            XUUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$T/x.plist")
            XAPPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$T/x.plist")
            XBUNDLE_ID="${XAPPID#*.}"
            for v in "$XUUID" "$XBUNDLE_ID"; do echo "::add-mask::$v" >&3; done
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              cp "$T/x.mobileprovision" "$d/$XUUID.mobileprovision"; done
            rm -f "$T/x.mobileprovision" "$T/x.plist"
            { echo "EXT_PROFILE_UUID=$XUUID"; echo "EXT_BUNDLE_ID=$XBUNDLE_ID"; } >> "$GITHUB_ENV"
          fi
          echo "✔ ok" >&3

      - name: Expo prebuild
        if: ${{ env.NATIVE != '1' }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC"; . "$APP_ENV_FILE"
          CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild -p ios --clean --no-install
          PRJ=$(ls -d ios/*.xcodeproj | head -n1)
          NAME=$(basename "$PRJ" .xcodeproj); echo "::add-mask::$NAME" >&3
          PL="ios/$NAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PL"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PL" || true
          echo "SCHEME=$NAME" >> "$GITHUB_ENV"
          echo "✔ ok" >&3

      - name: Pod install
        if: ${{ env.NATIVE != '1' }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC/ios"
          pod install
          echo "✔ ok" >&3

      - name: Configure signing
        if: ${{ env.NATIVE != '1' && !inputs.compile_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC/ios"
          ruby -rxcodeproj -e '
            p = Xcodeproj::Project.open("#{ENV["SCHEME"]}.xcodeproj")
            ta = (p.root_object.attributes["TargetAttributes"] ||= {})
            n = 0
            p.native_targets.select { |t| t.product_type == "com.apple.product-type.application" }.each do |t|
              (ta[t.uuid] ||= {})["ProvisioningStyle"] = "Manual"
              t.build_configurations.each do |c|
                s = c.build_settings
                s["CODE_SIGN_STYLE"] = "Manual"
                s["DEVELOPMENT_TEAM"] = ENV["TEAM"]
                s["CODE_SIGN_IDENTITY"] = "iPhone Distribution"
                s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "iPhone Distribution"
                s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
                s["CURRENT_PROJECT_VERSION"] = ENV["BUILD_NUMBER"]
                n += 1
              end
            end
            raise "no app target" if n == 0
            p.save'
          echo "✔ ok" >&3

      - name: Archive
        if: ${{ env.NATIVE != '1' && !inputs.compile_only }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC/ios"; . "$APP_ENV_FILE"
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" archive
          echo "✔ ok" >&3

      - name: Native project
        if: ${{ env.NATIVE == '1' && !inputs.compile_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC"; . "$APP_ENV_FILE"
          if [ -f project.yml ]; then
            command -v xcodegen || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
            xcodegen generate --spec project.yml
          fi
          PRJ=$(ls -d *.xcodeproj | head -n1)
          NAME=$(basename "$PRJ" .xcodeproj); echo "::add-mask::$NAME" >&3
          ruby -rxcodeproj -e '
            p = Xcodeproj::Project.open(ARGV[0])
            prof = { ENV["BUNDLE_ID"] => ENV["PROFILE_UUID"] }
            prof[ENV["WATCH_BUNDLE_ID"]] = ENV["WATCH_PROFILE_UUID"] if ENV["WATCH_BUNDLE_ID"].to_s != ""
            prof[ENV["EXT_BUNDLE_ID"]] = ENV["EXT_PROFILE_UUID"] if ENV["EXT_BUNDLE_ID"].to_s != ""
            types = ["com.apple.product-type.application", "com.apple.product-type.application.watchapp2-container",
                     "com.apple.product-type.application.watchapp2", "com.apple.product-type.app-extension",
                     "com.apple.product-type.watchkit2-extension", "com.apple.product-type.extensionkit-extension"]
            ta = (p.root_object.attributes["TargetAttributes"] ||= {})
            n = 0; ios = false; watch = false
            p.native_targets.select { |t| types.include?(t.product_type) }.each do |t|
              ios = true if t.product_type.end_with?("watchapp2-container")
              (ta[t.uuid] ||= {})["ProvisioningStyle"] = "Manual"
              t.build_configurations.each do |c|
                s = c.build_settings
                sdk = (s["SDKROOT"] || t.sdk.to_s)
                watch = true if sdk.start_with?("watchos")
                ios = true if sdk.start_with?("iphoneos")
                bid = s["PRODUCT_BUNDLE_IDENTIFIER"]
                uuid = prof[bid] or raise "no profile for target #{t.name}"
                s["CODE_SIGN_STYLE"] = "Manual"
                s["DEVELOPMENT_TEAM"] = ENV["TEAM"]
                s["CODE_SIGN_IDENTITY"] = "iPhone Distribution"
                s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "iPhone Distribution"
                s["CODE_SIGN_IDENTITY[sdk=watchos*]"] = "iPhone Distribution"
                s["PROVISIONING_PROFILE_SPECIFIER"] = uuid
                s["CURRENT_PROJECT_VERSION"] = ENV["BUILD_NUMBER"]
                n += 1
              end
            end
            raise "no app target" if n == 0
            p.save
            # watch-only apps ship inside an iOS container and archive as iOS; a bare watchOS project archives as watchOS
            File.write(ENV["GITHUB_ENV"], "DEST=generic/platform=#{(ios || !watch) ? "iOS" : "watchOS"}\n", mode: "a")' "$PRJ"
          { echo "SCHEME=$NAME"; echo "PRJ=$SRC/$PRJ"; } >> "$GITHUB_ENV"
          find . -maxdepth 3 -name '*Info.plist' -not -path './build/*' | while read -r f; do /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$f" || true; done
          echo "✔ ok" >&3

      - name: Archive (native)
        if: ${{ env.NATIVE == '1' && !inputs.compile_only }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          cd "$SRC"; . "$APP_ENV_FILE"
          xcodebuild -project "$PRJ" -scheme "$SCHEME" -configuration Release \
            -destination "$DEST" -archivePath "$RUNNER_TEMP/app.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" archive
          echo "✔ ok" >&3

      - name: Compile (native)
        if: ${{ env.NATIVE == '1' && inputs.compile_only }}
        env:
          BUILD_KIND: native
          APP_SCHEME: ${{ secrets[format('{0}_SCHEME', inputs.app)] }}
          COMPILE_DESTINATION: ${{ inputs.compile_destination }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
          bash -s <<'COMPILE_ONLY_EOF'
          #!/usr/bin/env bash
          # Compile-only xcodebuild for ios-build.
          #
          # Does not import signing certificates, provisioning profiles, or an App Store
          # Connect key. Does not create an xcarchive, export, upload, boot a simulator, or launch the
          # app. Project signing settings are left as committed; the build overrides only
          # CODE_SIGNING_ALLOWED and CODE_SIGNING_REQUIRED.
          #
          # Full compiler output stays on stdout (the encrypted job log). fd 3 receives
          # the exit code and sanitized error lines.
          #
          # Bash 3.2 compatible (macOS /bin/bash).
          set -euo pipefail

          compile_fail() {
            printf '%s\n' "$1" >&3
            exit 1
          }

          compile_only_strip_prefix() {
            line=$1
            prefix=$2
            if [ -z "$prefix" ]; then
              printf '%s\n' "$line"
              return
            fi
            while :; do
              case "$line" in
                *"$prefix"*)
                  prev=$line
                  left=${line%%"$prefix"*}
                  right=${line#*"$prefix"}
                  line="${left}${right}"
                  [ "$line" = "$prev" ] && break
                  ;;
                *)
                  break
                  ;;
              esac
            done
            printf '%s\n' "$line"
          }

          compile_only_relativize() {
            line=$1
            src=${SRC-}
            src=${src%/}
            tmp=${RUNNER_TEMP-}
            tmp=${tmp%/}
            if [ -n "${src:-}" ]; then
              line=$(compile_only_strip_prefix "$line" "$src/")
              line=$(compile_only_strip_prefix "$line" "/private${src}/")
            fi
            if [ -n "${tmp:-}" ]; then
              line=$(compile_only_strip_prefix "$line" "$tmp/")
              line=$(compile_only_strip_prefix "$line" "/private${tmp}/")
            fi
            printf '%s\n' "$line"
          }

          # Read a pbxproj and print the generic destination. ios|simulator selects the
          # SDK family. A project that mentions watchos and not iphoneos is watch-only;
          # anything else (including an iOS app that embeds watchOS) stays on iOS.
          compile_only_destination() {
            pbx=$1
            mode=$2
            watch=0
            ios=0
            if grep -q 'watchos' "$pbx"; then
              watch=1
            fi
            if grep -q 'iphoneos' "$pbx"; then
              ios=1
            fi
            platform="iOS"
            if [ "$watch" -eq 1 ] && [ "$ios" -eq 0 ]; then
              platform="watchOS"
            fi
            if [ "$mode" = "simulator" ]; then
              printf 'generic/platform=%s Simulator\n' "$platform"
            else
              printf 'generic/platform=%s\n' "$platform"
            fi
          }

          compile_only_sdk() {
            case "$1" in
              "generic/platform=iOS") printf 'iphoneos\n' ;;
              "generic/platform=iOS Simulator") printf 'iphonesimulator\n' ;;
              "generic/platform=watchOS") printf 'watchos\n' ;;
              "generic/platform=watchOS Simulator") printf 'watchsimulator\n' ;;
              *) return 1 ;;
            esac
          }

          compile_only_public_errors() {
            file=$1
            n=0
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] || continue
              if [ "${#line}" -gt 400 ]; then
                line=${line:0:400}
              fi
              case "$line" in
                *"BEGIN PRIVATE"*|*"BEGIN CERTIFICATE"*|*"BEGIN RSA"*|*oit_*|*ghp_*|*github_pat_*|*password=*|*PASSWORD=*)
                  continue
                  ;;
              esac
              case "$line" in
                *"://"*@*) continue ;;
              esac
              line=$(compile_only_relativize "$line")
              case "$line" in
                *": error:"*|*"fatal error:"*|*"Undefined symbols"*|*"undefined symbol"*|*"ld: "*|*"clang: "*|*"** BUILD FAILED"*|*"** BUILD SUCCEEDED"*|*"The following build commands failed"*)
                  printf '%s\n' "$line"
                  n=$((n + 1))
                  if [ "$n" -ge 40 ]; then
                    break
                  fi
                  ;;
              esac
            done < "$file"
          }

          compile_only_main() {
            if ! { true >&3; } 2>/dev/null; then
              exec 3>&1
            fi
            : "${SRC:?}"
            : "${RUNNER_TEMP:?}"
            : "${BUILD_KIND:?}"
            mode=${COMPILE_DESTINATION:-ios}
            case "$mode" in
              ios|simulator) ;;
              *) compile_fail "invalid compile destination" ;;
            esac
            if [ -n "${APP_ENV_FILE:-}" ] && [ -f "$APP_ENV_FILE" ]; then
              # shellcheck disable=SC1090
              . "$APP_ENV_FILE"
            fi

            out="$RUNNER_TEMP/xcodebuild.out"
            : > "$out"

            if [ "$BUILD_KIND" = "native" ]; then
              cd "$SRC"
              if [ -f project.yml ]; then
                command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
                xcodegen generate --spec project.yml
              fi
              prj=""
              scheme=""
              if [ -n "${APP_SCHEME:-}" ]; then
                case "$APP_SCHEME" in
                  *[!A-Za-z0-9._+-]*) compile_fail "invalid scheme" ;;
                esac
                scheme=$APP_SCHEME
              fi
              for cand in *.xcodeproj; do
                [ -d "$cand" ] || continue
                if [ -n "$scheme" ] && [ "$cand" = "${scheme}.xcodeproj" ]; then
                  prj=$cand
                  break
                fi
                if [ -z "$prj" ]; then
                  prj=$cand
                fi
              done
              [ -n "$prj" ] && [ -d "$prj" ] || compile_fail "xcodeproj missing"
              if [ -z "$scheme" ]; then
                scheme=$(basename "$prj" .xcodeproj)
              fi
              pbx="$prj/project.pbxproj"
              [ -f "$pbx" ] || compile_fail "project file missing"
              dest=$(compile_only_destination "$pbx" "$mode")
              sdk=$(compile_only_sdk "$dest") || compile_fail "invalid compile destination"
              printf 'compile project=%s scheme=%s destination=%s sdk=%s\n' "$prj" "$scheme" "$dest" "$sdk"
              set +e
              xcodebuild -project "$prj" -scheme "$scheme" -configuration Release \
                -destination "$dest" -sdk "$sdk" \
                build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                >"$out" 2>&1
              st=$?
              set -e
            elif [ "$BUILD_KIND" = "workspace" ]; then
              [ -n "${SCHEME:-}" ] || compile_fail "scheme missing"
              cd "$SRC/ios"
              if [ "$mode" = "simulator" ]; then
                dest="generic/platform=iOS Simulator"
              else
                dest="generic/platform=iOS"
              fi
              sdk=$(compile_only_sdk "$dest") || compile_fail "invalid compile destination"
              printf 'compile workspace=%s scheme=%s destination=%s sdk=%s\n' "$SCHEME.xcworkspace" "$SCHEME" "$dest" "$sdk"
              set +e
              xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
                -destination "$dest" -sdk "$sdk" \
                build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                >"$out" 2>&1
              st=$?
              set -e
            else
              compile_fail "invalid build kind"
            fi

            cat "$out"
            if [ "$st" -ne 0 ]; then
              printf 'xcodebuild exit %s\n' "$st" >&3
              compile_only_public_errors "$out" >&3 || true
              exit "$st"
            fi
            printf '✔ ok\n' >&3
          }

          if [ "${COMPILE_ONLY_LIB:-}" != 1 ]; then
            compile_only_main
          fi
          COMPILE_ONLY_EOF

      - name: Compile
        if: ${{ env.NATIVE != '1' && inputs.compile_only }}
        env:
          BUILD_KIND: workspace
          COMPILE_DESTINATION: ${{ inputs.compile_destination }}
        run: |
          exec 3>&1 >>"$LOG" 2>&1; set -E; trap 'echo "✖ failed" >&3' ERR
